hostname router2

! Address to advertise through BGP later.
interface lo
 ip address 10.255.0.2/32
exit

! Link to Router 1.
interface eth1
 ip address 10.0.12.2/30
exit

! Link to Router 3.
interface eth2
 ip address 10.0.23.1/30
exit

! Run BGP in AS 65002.
router bgp 65002
 ! Stable identifier for this BGP router.
 bgp router-id 10.255.0.2
 ! Peer with AS 65001.
 neighbor 10.0.12.1 remote-as 65001
 ! Peer with AS 65003.
 neighbor 10.0.23.2 remote-as 65003
 address-family ipv4 unicast
  ! Advertise this router's loopback.
  network 10.255.0.2/32
  ! Only exchange project loopbacks with 10.0.12.1.
  neighbor 10.0.12.1 prefix-list LOOPBACKS in
  neighbor 10.0.12.1 prefix-list LOOPBACKS out
  ! Only exchange project loopbacks with 10.0.23.2.
  neighbor 10.0.23.2 prefix-list LOOPBACKS in
  neighbor 10.0.23.2 prefix-list LOOPBACKS out
 exit-address-family
exit

! Only allow the project loopback routes.
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.1/32
ip prefix-list LOOPBACKS seq 20 permit 10.255.0.2/32
ip prefix-list LOOPBACKS seq 30 permit 10.255.0.3/32
