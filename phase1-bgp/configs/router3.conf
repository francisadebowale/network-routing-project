hostname router3

! Address to advertise through BGP later.
interface lo
 ip address 10.255.0.3/32
exit

! Link to Router 2.
interface eth1
 ip address 10.0.23.2/30
exit

! Run BGP in AS 65003.
router bgp 65003
 ! Stable identifier for this BGP router.
 bgp router-id 10.255.0.3
 ! Peer with AS 65002.
 neighbor 10.0.23.1 remote-as 65002
 address-family ipv4 unicast
  ! Advertise this router's loopback.
  network 10.255.0.3/32
  ! Only exchange project loopbacks with 10.0.23.1.
  neighbor 10.0.23.1 prefix-list LOOPBACKS in
  neighbor 10.0.23.1 prefix-list LOOPBACKS out
 exit-address-family
exit

! Only allow the project loopback routes.
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.1/32
ip prefix-list LOOPBACKS seq 20 permit 10.255.0.2/32
ip prefix-list LOOPBACKS seq 30 permit 10.255.0.3/32
