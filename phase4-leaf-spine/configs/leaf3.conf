hostname leaf3

! Link to Spine 1.
interface eth1
 ip address 10.1.3.1/30
exit

! Link to Spine 2.
interface eth2
 ip address 10.2.3.1/30
exit

! Link to Host B.
interface eth3
 ip address 192.168.30.1/24
exit

! Peer with both spines.
router bgp 65103
 bgp router-id 10.1.3.1
 neighbor 10.1.3.2 remote-as 65000
 neighbor 10.2.3.2 remote-as 65000
exit
