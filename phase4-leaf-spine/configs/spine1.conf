hostname spine1

! Link to Leaf 1.
interface eth1
 ip address 10.1.1.2/30
exit

! Link to Leaf 2.
interface eth2
 ip address 10.1.2.2/30
exit

! Link to Leaf 3.
interface eth3
 ip address 10.1.3.2/30
exit

! Peer with all three leaves.
router bgp 65000
 bgp router-id 10.1.1.2
 neighbor 10.1.1.1 remote-as 65101
 neighbor 10.1.2.1 remote-as 65102
 neighbor 10.1.3.1 remote-as 65103
 address-family ipv4 unicast
  ! Exchange only the two host subnets.
  neighbor 10.1.1.1 prefix-list HOST-SUBNETS in
  neighbor 10.1.1.1 prefix-list HOST-SUBNETS out
  neighbor 10.1.2.1 prefix-list HOST-SUBNETS in
  neighbor 10.1.2.1 prefix-list HOST-SUBNETS out
  neighbor 10.1.3.1 prefix-list HOST-SUBNETS in
  neighbor 10.1.3.1 prefix-list HOST-SUBNETS out
 exit-address-family
exit

! Exact prefixes only; other routes are denied.
ip prefix-list HOST-SUBNETS seq 10 permit 192.168.10.0/24
ip prefix-list HOST-SUBNETS seq 20 permit 192.168.30.0/24
