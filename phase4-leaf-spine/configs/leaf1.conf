hostname leaf1

! Link to Spine 1.
interface eth1
 ip address 10.1.1.1/30
exit

! Link to Spine 2.
interface eth2
 ip address 10.2.1.1/30
exit

! Link to Host A.
interface eth3
 ip address 192.168.10.1/24
exit

! Peer with both spines.
router bgp 65101
 bgp router-id 10.1.1.1
 neighbor 10.1.1.2 remote-as 65000
 neighbor 10.2.1.2 remote-as 65000
exit
