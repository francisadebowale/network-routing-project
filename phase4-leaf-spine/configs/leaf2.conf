hostname leaf2

! Link to Spine 1.
interface eth1
 ip address 10.1.2.1/30
exit

! Link to Spine 2.
interface eth2
 ip address 10.2.2.1/30
exit

! Peer with both spines.
router bgp 65102
 bgp router-id 10.1.2.1
 neighbor 10.1.2.2 remote-as 65000
 neighbor 10.2.2.2 remote-as 65000
 address-family ipv4 unicast
  ! Exchange only the two host subnets.
  neighbor 10.1.2.2 prefix-list HOST-SUBNETS in
  neighbor 10.1.2.2 prefix-list HOST-SUBNETS out
  neighbor 10.2.2.2 prefix-list HOST-SUBNETS in
  neighbor 10.2.2.2 prefix-list HOST-SUBNETS out
 exit-address-family
exit

! Exact prefixes only; other routes are denied.
ip prefix-list HOST-SUBNETS seq 10 permit 192.168.10.0/24
ip prefix-list HOST-SUBNETS seq 20 permit 192.168.30.0/24
