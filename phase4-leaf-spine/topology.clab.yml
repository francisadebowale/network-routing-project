# Two-spine, three-leaf topology.
name: leaf-spine

topology:
  nodes:
    spine1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    spine2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    leaf1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    leaf2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    leaf3:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    host-a:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity

    host-b:
      kind: linux
      image: alpine:3.20
      cmd: sleep infinity

  links:
    # Each leaf connects to both spines.
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]

    # Hosts on different leaves for forwarding tests later.
    - endpoints: ["host-a:eth1", "leaf1:eth3"]
    - endpoints: ["host-b:eth1", "leaf3:eth3"]
