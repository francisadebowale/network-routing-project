# Project topology name.
name: static-routing

topology:
  nodes:
    host-a:
      kind: linux
      image: alpine:3.20
      # Keep the host running.
      cmd: sleep infinity

    router1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    router2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    host-b:
      kind: linux
      image: alpine:3.20
      # Keep the host running.
      cmd: sleep infinity

  links:
    # Host A to Router 1.
    - endpoints: ["host-a:eth1", "router1:eth1"]

    # Connection between the routers.
    - endpoints: ["router1:eth2", "router2:eth1"]

    # Router 2 to Host B.
    - endpoints: ["router2:eth2", "host-b:eth1"]
