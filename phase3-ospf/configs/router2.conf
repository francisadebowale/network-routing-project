hostname router2

! Loopback advertised through OSPF.
interface lo
 ! Advertise the loopback without sending neighbour discovery packets.
 ip ospf passive
 ip address 10.255.0.2/32
 ip ospf area 0
exit

! Link to Router 1.
interface eth1
 ip address 10.0.12.2/30
 ip ospf area 0
exit

! Link to Router 3.
interface eth2
 ip address 10.0.23.1/30
 ip ospf area 0
exit

router ospf
 ospf router-id 10.255.0.2
exit
