hostname router1

! Loopback advertised through OSPF.
interface lo
 ! Advertise the loopback without sending neighbour discovery packets.
 ip ospf passive
 ip address 10.255.0.1/32
 ip ospf area 0
exit

! Link to Router 2.
interface eth1
 ip address 10.0.12.1/30
 ip ospf area 0
exit

router ospf
 ospf router-id 10.255.0.1
exit
