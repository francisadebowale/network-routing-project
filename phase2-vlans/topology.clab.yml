# VLAN switching and routing topology.
name: vlans

topology:
  nodes:
    switch:
      kind: linux
      image: alpine:3.20
      # Keep the switch container running.
      cmd: sleep infinity
      exec:
        # Use the mirror verified reachable from this environment.
        - sed -i 's/dl-cdn.alpinelinux.org/dl-4.alpinelinux.org/g' /etc/apk/repositories
        - apk add --no-cache iproute2
        # Filter traffic by VLAN, with no default VLAN membership.
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        # Untagged host traffic belongs to its access port's VLAN.
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        # Carry both VLANs tagged on the router link.
        - bridge vlan add dev eth4 vid 10
        - bridge vlan add dev eth4 vid 20
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip link set br0 up

    router:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/router.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        # Separate the tagged trunk into one interface per VLAN.
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ip link set eth1 up
        - ip link set eth1.10 up
        - ip link set eth1.20 up

    host-a:
      kind: linux
      image: alpine:3.20
      # Access host in VLAN 10.
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1

    host-b:
      kind: linux
      image: alpine:3.20
      # Access host in VLAN 10.
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.10.11/24 dev eth1
        - ip route replace default via 192.168.10.1 dev eth1

    host-c:
      kind: linux
      image: alpine:3.20
      # Access host in VLAN 20.
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route replace default via 192.168.20.1 dev eth1

  links:
    # Host access links.
    - endpoints: ["host-a:eth1", "switch:eth1"]
    - endpoints: ["host-b:eth1", "switch:eth2"]
    - endpoints: ["host-c:eth1", "switch:eth3"]

    # Tagged VLAN trunk to the router.
    - endpoints: ["switch:eth4", "router:eth1"]
