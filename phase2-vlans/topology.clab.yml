# VLAN switching topology.
name: vlans

topology:
  nodes:
    switch:
      kind: linux
      image: alpine:3.20
      # Keep the switch container running.
      cmd: sleep infinity
      exec:
        # Use the mirror verified reachable from this environment.
        - sed -i 's/dl-cdn.alpinelinux.org/dl-4.alpinelinux.org/g' /etc/apk/repositories
        - apk add --no-cache iproute2
        # Filter traffic by VLAN, with no default VLAN membership.
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        # Untagged host traffic belongs to its access port's VLAN.
        - bridge vlan add dev eth1 vid 10 pvid untagged
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        # Carry both VLANs tagged on the router link.
        - bridge vlan add dev eth4 vid 10
        - bridge vlan add dev eth4 vid 20
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip link set br0 up

    router:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1

    host-a:
      kind: linux
      image: alpine:3.20
      # Planned for VLAN 10.
      cmd: sleep infinity

    host-b:
      kind: linux
      image: alpine:3.20
      # Planned for VLAN 10.
      cmd: sleep infinity

    host-c:
      kind: linux
      image: alpine:3.20
      # Planned for VLAN 20.
      cmd: sleep infinity

  links:
    # Host access links.
    - endpoints: ["host-a:eth1", "switch:eth1"]
    - endpoints: ["host-b:eth1", "switch:eth2"]
    - endpoints: ["host-c:eth1", "switch:eth3"]

    # Future VLAN trunk to the router.
    - endpoints: ["switch:eth4", "router:eth1"]
